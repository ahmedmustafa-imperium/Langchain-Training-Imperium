[project]
name = "Langchain-Training"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Ahmed Mustafa", email = "ahmed.mustafa@imperiumdynamics.com"},
]
dependencies = ["langchain>=0.3.27", "langchain-openai>=0.3.35", "python-dotenv>=1.1.1", "pypdf>=6.1.1", "beautifulsoup4>=4.14.2", "faiss-cpu>=1.12.0", "langchain-community>=0.3.31"]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "black>=25.9.0",
    "flake8>=7.3.0",
    "ipython>=9.6.0",
]
