[project]
name = "Langchain-Training"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Ahmed Mustafa", email = "ahmed.mustafa@imperiumdynamics.com"},
]
dependencies = ["langchain>=0.3.27", "langchain-openai>=0.3.35", "python-dotenv>=1.1.1", "pypdf>=6.1.1", "beautifulsoup4>=4.14.2", "faiss-cpu>=1.12.0", "langchain-community>=0.3.31", "duckduckgo-search>=8.1.1", "ddgs>=9.6.1"]
requires-python = "==3.11.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "black>=25.9.0",
    "flake8>=7.3.0",
    "ipython>=9.6.0",
]

[tool.pdm.scripts]
# Individual tasks
task1 = "python -m task_1.task_1"
task2 = "python -m task_2.task_2"
task3 = "python -m task_3.task_3"
task4 = "python -m task_4.task_4"
task5 = "python -m task_5.task_5"
task6 = "python -m task_6.task_6"
task7 = "python -m task_7.task_7"
task8 = "python -m task_8.task_8"
task9 = "python -m task_9.task_9"
task10 = "python -m task_10.task_10"
task11 = "python -m task_11.task_11"
# Master command to run all sequentially
start = { composite = ["task1", "task2", "task3", "task4", "task5", "task6", "task7","task8","task9","task10","task11"] }  